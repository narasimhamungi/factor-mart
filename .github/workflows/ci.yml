name: DuckDB tests

# Runs the unit/integration suite on DuckDB for every push and pull request.
# Not covered here (needs Snowflake credentials, run manually): the live Snowflake load and
# `python -m factor_mart.parity`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (DuckDB only; no Snowflake or Postgres extras)
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
